name: EAS Development Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint -- --max-warnings 0
        continue-on-error: true

      - name: Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Expo Prebuild
        working-directory: ./frontend
        env:
          EXPO_NO_DOCTOR: "1"
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: Patch Kotlin and AGP versions
        working-directory: ./frontend/android
        run: |
          sed -i "s/kotlinVersion = findProperty('android.kotlinVersion') ?: '[^']*'/kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'/g" build.gradle
          sed -i "s/kotlinVersion = '[0-9][0-9.]*'/kotlinVersion = '1.9.25'/g" build.gradle
          sed -i 's/com\.android\.tools\.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:8.3.2/g' build.gradle
          echo "Patched build.gradle:"
          cat build.gradle

      - name: Download Gradle Wrapper JAR
        run: |
          GRADLE_VERSION=$(grep distributionUrl frontend/android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          mkdir -p frontend/android/gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/refs/tags/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o frontend/android/gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "frontend/android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Failed to download Gradle wrapper"
            exit 1
          fi
          echo "Gradle wrapper downloaded successfully"

      - name: Generate Android Keystore
        working-directory: ./frontend
        run: |
          if [ -z "${{ secrets.EAS_KEYSTORE_BASE64 }}" ]; then
            echo "Using ephemeral dev keystore (not suitable for production)"
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias dev-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -storepass devpass \
              -keypass devpass \
              -dname "CN=Securestop Dev, OU=Development, O=Securestop, L=NJ, S=NJ, C=US"
          else
            echo "Using production keystore from secrets"
            echo "${{ secrets.EAS_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          fi

      - name: Build Android dev client (APK)
        working-directory: ./frontend
        env:
          EXPO_NO_DOCTOR: "1"
        run: eas build --profile development --platform android --local --output ./build.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-apk
          path: ./frontend/build.apk
          if-no-files-found: error
