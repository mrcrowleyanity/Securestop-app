name: EAS Development Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Expo Prebuild
        working-directory: ./frontend
        env:
          EXPO_NO_DOCTOR: "1"
        run: |
          npx expo prebuild --clean --platform android
          chmod +x android/gradlew

      - name: Patch Kotlin and AGP versions
        working-directory: ./frontend/android
        run: |
          sed -i "s/kotlinVersion = findProperty('android.kotlinVersion') ?: '[^']*'/kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'/g" build.gradle
          sed -i "s/kotlinVersion = '[0-9][0-9.]*'/kotlinVersion = '1.9.25'/g" build.gradle
          sed -i 's/com\.android\.tools\.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:8.3.2/g' build.gradle
          echo "Patched build.gradle:"
          cat build.gradle

      - name: Download Gradle Wrapper JAR
        run: |
          GRADLE_VERSION=$(grep distributionUrl frontend/android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\(.*\)-bin.zip/\1/')
          mkdir -p frontend/android/gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/refs/tags/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o frontend/android/gradle/wrapper/gradle-wrapper.jar

      - name: Generate Android Keystore
        working-directory: ./frontend
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Securestop, OU=Dev, O=Securestop, L=NJ, S=NJ, C=US"
          node -e "const fs=require('fs');fs.writeFileSync('credentials.json',JSON.stringify({android:{keystore:{keystorePath:'android.keystore',keystorePassword:'android',keyAlias:'my-key-alias',keyPassword:'android'}}},null,2))"

      - name: Build Android dev client (APK)
        working-directory: ./frontend
        env:
          EXPO_NO_DOCTOR: "1"
        run: eas build --profile development --platform android --local --output ./build.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-apk
          path: ./frontend/build.apk
          if-no-files-found: error
